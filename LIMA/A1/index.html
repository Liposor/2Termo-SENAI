<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1 - Introdução ao HTML</title>
</head>
<body>
    <div class="container">
        <h1 class="titulo">
        Hello World!
        </h1>

        <h2>
        Meu nome é: <br> 
        </h2> <h2 class="nome"><b>Luis</b></h2>

        <h1>HTML - Hypertext Markup Language</h1>
        <p>Linguage de marcação em HiperTexto</p>
        <hr class="divisao">


        <!-- Tags
        h1 a h6 - Cabeçalhos e título de sessão
        br -- quebrar linha
        p - paragrafo -->


        <h1>CSS - Cascade Style Sheets</h1>
        <p>Formatação em estilos de cascada</p>
        <a href="#">Uma página sobre CSS</a> <br>
        <a href="css.html">CSS</a>
    </div>
    

</body>
<style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f2f5;
            padding: 30px;

        }

    .container {
        width: 600px;
        margin: auto;
        border: 1px solid #d0d7de;
        border-radius: 12px;
        padding: 45px;
        box-shadow:0 4px 12px rgba(0,0,0,.06);
    }
         
    .nome {
        color: purple;
        font-size: 40px;
        box-shadow:0 4px 12px rgba(0,0,0,.06);
        border-radius: 12px;
        padding: 10px;
    }



    .titulo {
        color: blue;

    }
